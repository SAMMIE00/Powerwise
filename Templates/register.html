<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | PowerWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  <script>
    try { document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light"); } catch (e) {}
  </script>
</head>
<body>

  <!-- Shared SVG Icons -->
  <svg class="icon-sprite" width="0" height="0" aria-hidden="true" style="display: none;">
    <symbol id="i-zap" viewBox="0 0 24 24">
      <path d="m13 2-9 12h7l-1 8 10-13h-7l1-7Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" fill="none" stroke="currentColor" stroke-width="2"/>
      <polyline points="22,6 12,13 2,6" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" fill="currentColor"/>
      <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="2"/>
    </symbol>
  </svg>

  <div class="auth-top-bar">
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode">
      <svg class="i moon" aria-hidden="true" style="width: 18px; height: 18px;"><use href="#i-moon"/></svg>
      <svg class="i sun" aria-hidden="true" style="width: 18px; height: 18px;"><use href="#i-sun"/></svg>
    </button>
  </div>

  <main class="auth-wrapper">
    <div class="auth-bg-glow top-left"></div>
    <div class="auth-bg-glow bottom-right"></div>

    <section class="auth-card" aria-labelledby="register-title">
      <header class="auth-header">
        <a class="auth-brand" href="{{ url_for('dashboard') }}">
          <span class="brand-mark">
            <svg aria-hidden="true"><use href="#i-zap"/></svg>
          </span>
          <span>PowerWise</span>
        </a>
        <h1 id="register-title">Create Account</h1>
        <p>Manage your household electricity easily.</p>
      </header>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="auth-alerts" role="alert">
            {% for category, message in messages %}
              <div class="auth-alert {{ category }}">
                <span>{{ message }}</span>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="input-icon" aria-hidden="true"><use href="#i-user"/></svg>
            <input
              type="text"
              id="username"
              name="username"
              class="auth-input"
              placeholder="e.g. samuel"
              value="{{ username or '' }}"
              autocomplete="username"
              required
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg class="input-icon" aria-hidden="true"><use href="#i-mail"/></svg>
            <input
              type="email"
              id="email"
              name="email"
              class="auth-input"
              placeholder="e.g. samuel@example.com"
              value="{{ email or '' }}"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" aria-hidden="true"><use href="#i-lock"/></svg>
            <input
              type="password"
              id="password"
              name="password"
              class="auth-input"
              placeholder="Minimum 8 characters"
              autocomplete="new-password"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="input-wrap">
            <svg class="input-icon" aria-hidden="true"><use href="#i-lock"/></svg>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              class="auth-input"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            >
          </div>
        </div>

        <button type="submit" class="auth-submit-btn" id="submitBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <footer class="auth-footer">
        Already have an account?
        <a class="auth-switch-link" href="{{ url_for('auth.login') }}">Sign In</a>
      </footer>
    </section>
  </main>

  <script>
    // Theme toggle
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("themeBtn");
      if (!btn) return;

      function apply(theme) {
        var dark = theme === "dark";
        root.setAttribute("data-theme", dark ? "dark" : "light");
        btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      }

      var saved = "light";
      try { saved = localStorage.getItem("theme") || "light"; } catch (e) {}
      apply(saved);

      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        apply(next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
